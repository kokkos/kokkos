name: mdspan version check

on:
  pull_request:
    paths:
      - '.github/workflows/mdspan-version-check.yml'
      - 'tpls/mdspan-hash.txt'
      - 'tpls/mdspan/**'

permissions: read-all

jobs:
  mdspan-version-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: echo "ref=$(cat tpls/mdspan-hash.txt)" >> $GITHUB_ENV
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: kokkos/mdspan
        ref: ${{ env.ref }}
        path: kokkos-mdspan
    - run: |
        diff --unified=3 --recursive \
          --exclude=.clang-tidy \
          --exclude=.git \
          --exclude=.github \
          --exclude=.gitignore \
          --exclude=benchmarks \
          --exclude=comp_bench \
          --exclude=compilation_tests \
          --exclude=examples \
          --exclude=LICENSE_FILE_HEADER \
          --exclude=make_single_header.py \
          --exclude=metabench.cmake \
          --exclude=README.md \
          --exclude=scripts \
          --exclude=tests \
          tpls/mdspan kokkos-mdspan
