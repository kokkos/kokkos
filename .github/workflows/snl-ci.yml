            -DKokkos_ARCH_VOLTA70=ON \
            -DKokkos_ENABLE_DEPRECATED_CODE_5=OFF \
            ./

      - name: build_and_install_kokkos
        working-directory: kokkos
        run: |
          cmake --build build -j36
          cmake --install build --prefix install

      - name: test_kokkos
        working-directory: kokkos/build
        run: ctest --output-on-failure --timeout 3600

  SNL_NextSilicon_Latest:
    name: SNL_NextSilicon_Latest
    needs: SNL_NeedChecks
    if: needs.SNL_NeedChecks.outputs.code == 'true'
    runs-on: [next-latest]

    steps:
      - name: Environment Information
        run: |
          nextcli --version
          nextcxx --version
          cmake --version
      # Give nextsystemd 20s to get going and check that everything is up
      - name: Initialize Hardware
        run: |
          nextsystemd --ui-collector-address none &
          sleep 20
          nextcli system status
          nextcli system status | grep "Service: UP"
          nextcli system status | grep "Maverick 2"
          nextcli system status | grep "Status: OK"
          nextcli system terminate

      - name: checkout_kokkos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kokkos/kokkos
          path: kokkos

      - name: configure_kokkos
        run: |
          cd kokkos
          cmake -B build \
            -DKokkos_ENABLE_NEXTSILICON=ON \
            -DKokkos_ENABLE_TESTS=ON \
            -DKokkos_ENABLE_COMPILER_WARNINGS=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE=/opt/nextsilicon/share/cmake/Modules/next-toolchain.cmake \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-Werror -Wno-ns-unsupported-type"

      - name: build_kokkos
        working-directory: kokkos
        run: |
          cmake --build build --parallel $(nproc)

      # the SNL runners map a named volume to $HOME/optimizer-cache for a persistent
      # optimizer cache across runs. If this doesn't get mapped, nextsystemd will
      # create this directory and use it as a cache, but the contents will be lost
      # when the container exits
      - name: test_kokkos_telemetryless
        # FIXME_NEXTSILICON: re-enable when telemetry-less mode is working
        if: false
        working-directory: kokkos/build
        env:
          # FIXME_NEXTSILICON: death tests require fork, not supported by runtime
          GTEST_FILTER: -*DeathTest*
          KOKKOS_NEXTSILICON_TEST_TELEMETRYLESS: 1
          XDG_CACHE_HOME: $HOME/optimizer-cache
          __TINYALLOC_HEAP_SIZE: 1073741824
          __TINYALLOC_HEAP_MAX_CHUNKS: 4194304
        # FIXME_NEXTSILICON: disable core dumps for now
        run: |
          ulimit -c 0
          ctest -V --timeout 1800

      - name: test_kokkos
        working-directory: kokkos/build
        env:
          # FIXME_NEXTSILICON: death tests require fork, not supported by runtime
          GTEST_FILTER: -*DeathTest*
          XDG_CACHE_HOME: $HOME/optimizer-cache
          __TINYALLOC_HEAP_SIZE: 1073741824
          __TINYALLOC_HEAP_MAX_CHUNKS: 4194304
        # FIXME_NEXTSILICON: disable core dumps for now
        run: |
          ulimit -c 0
          ctest -V --timeout 1800

  SNL_Required_Checks:
    if: always()
    name: SNL_Required_Checks
    # bash command to collect this: [grep "name: SNL_" snl-ci.yml | awk '{print "      - "$3}']
    needs:
      - SNL_NeedChecks
      - SNL_CUDA_NVCC_12_2_CPP20
      - SNL_HIP_ROCM_6_2_1_CPP23
      - SNL_HIP_ROCM_6_2_1
      - SNL_OPENMP_SERIAL_INTEL_2024_2_1
      - SNL_SYCL_INTEL_2024_2_1
      - SNL_SERIAL_LLVM_14_0_6
      - SNL_SERIAL_CLANG_19_MODULES
      - SNL_HPX_GCC_15_1_1
      - SNL_OPENACC_CUDA_12_2_NVHPC_23_7_CPP20
      - SNL_NextSilicon_Latest
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        run: |
          if [[ "${{ needs.SNL_NeedChecks.outputs.code }}" == "true" ]]; then
            # code changed: no job should be skipped/failed/cancelled
            if [[ \
              "${{ contains(needs.*.result, 'failure') }}" == "true" || \
              "${{ contains(needs.*.result, 'cancelled') }}" == "true" || \
              "${{ contains(needs.*.result, 'skipped') }}" == "true" \
            ]]; then
              echo "At least one required SNL job did not succeed."
              exit 1
            fi
          fi

          echo "All required SNL jobs succeeded."
