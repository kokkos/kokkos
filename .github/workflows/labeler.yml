name: labeler

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          sync-labels: false
          configuration-path: .github/labeler.yml
