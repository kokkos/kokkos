name: github-benchmarks
on:
  workflow_call:

permissions: read-all

jobs:
  CI:
    continue-on-error: true
    strategy:
      # We must avoid pushing to the benchmark repository concurrently.
      max-parallel: 1
      matrix:
        distro: ['ubuntu:latest']
        cxx: ['g++', 'clang++']
        backend: ['OPENMP']
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kokkos/ci-containers/${{ matrix.distro }}
    env:
      BUILD_ID: ${{ matrix.distro }}-${{ matrix.cxx }}-${{ matrix.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: kokkos-${{ matrix.distro }}-${{ matrix.cxx }}-${{ matrix.backend }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: kokkos-${{ matrix.distro }}-${{ matrix.cxx }}-${{ matrix.backend }}-${{ github.ref }}
      - name: Configure Kokkos
        run: |
          cmake -B builddir \
            -DKokkos_ENABLE_HWLOC=ON \
            -DKokkos_ENABLE_${{ matrix.backend }}=ON \
            -DKokkos_ENABLE_BENCHMARKS=ON \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          ccache -z
          NUM_CPU=$(grep -c processor /proc/cpuinfo)
          cmake --build builddir --parallel ${NUM_CPU}
          ccache -s
      - name: Tests
        working-directory: builddir
        run: ctest --output-on-failure
      - name: Gather benchmark results
        run: |
          mkdir ${{ env.BUILD_ID }}
          find builddir/core/perf_test/ -name "*.json" -exec mv {} ${{ env.BUILD_ID }}/  \;
      - name: Archive benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.cxx }}-${{ matrix.backend }}
          path: ${{ env.BUILD_ID }}

      - name: Push benchmark results
        if: ${{ github.ref == 'refs/heads/develop' }}
        env:
          GH_TOKEN: ${{ secrets.MASTERLEINAD_PUSH_BENCHMARK_RESULTS }}
        run: |
          set -euo pipefail
          echo "Cloning benchmark-results repository"
          git clone \
            "https://x-access-token:${GH_TOKEN}@github.com/kokkos/kokkos-benchmark-results.git" \
              benchmark-results
          cd benchmark-results

          git config user.email "kokkos@users.noreply.github.com"
          git config user.name "Kokkos Developers"

          echo "Copying benchmark results"

          cp -a "../${BUILD_ID}" "${BUILD_ID}"
          git add "${BUILD_ID}"

          git commit -m "Update benchmark results for ${BUILD_ID}"

          echo "Pushing benchmark results"
          git push origin HEAD:main
